plugins { id 'com.android.application' }

// Copy the web game (repo root) into the APK's assets/www folder.
def webOut = layout.buildDirectory.dir("generated/webassets")
tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**'
    }
    into webOut.map { it.dir('www') }
}
preBuild.dependsOn 'copyWebAssets'

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.breachpoint.taskforce'
    compileSdk 34
    defaultConfig {
        applicationId 'com.breachpoint.taskforce'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }
    sourceSets { main { assets.srcDirs += webOut } }
    signingConfigs {
        release {
            def ks = System.getenv('BP_KEYSTORE')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('BP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BP_KEY_ALIAS')
                keyPassword System.getenv('BP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('BP_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // keep JS/CSS uncompressed-friendly; nothing else to configure
}
