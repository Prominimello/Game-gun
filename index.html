<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BREACHPOINT: TASK FORCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- Title screen -->
  <section id="scr-title" class="screen">
    <canvas id="title-bg"></canvas>
    <div class="title-wrap">
      <div class="logo">BREACHPOINT<span>TASK FORCE</span></div>
      <div class="tagline">Tactical Intervention Unit — Authorized Operations</div>
      <div class="menu" id="title-menu"></div>
      <div class="foot">All visuals procedurally drawn · All audio synthesized in real time</div>
    </div>
  </section>

  <!-- HQ -->
  <section id="scr-hq" class="screen hidden">
    <header class="topbar">
      <div class="brand">BREACHPOINT <small>HQ</small></div>
      <div class="tb-stats" id="hq-stats"></div>
      <div class="tb-actions">
        <button id="btn-settings" class="ghost">Settings</button>
        <button id="btn-quit" class="ghost">Main Menu</button>
      </div>
    </header>
    <nav class="hq-nav" id="hq-nav"></nav>
    <main class="hq-main" id="hq-main"></main>
  </section>

  <!-- Briefing / planning -->
  <section id="scr-brief" class="screen hidden"></section>

  <!-- Mission -->
  <section id="scr-mission" class="screen hidden">
    <canvas id="game"></canvas>
    <div id="hud"></div>
  </section>

  <!-- Debrief -->
  <section id="scr-debrief" class="screen hidden"></section>

  <!-- Replay -->
  <section id="scr-replay" class="screen hidden">
    <canvas id="replay-canvas"></canvas>
    <div id="replay-ui"></div>
  </section>

  <div id="modal" class="modal hidden"></div>
  <div id="toast"></div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/mapgen.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/mission_ui.js"></script>
<script src="js/hq.js"></script>
<script src="js/brief.js"></script>
<script src="js/main.js"></script>
</body>
</html>
