name: Build Android APK

on:
  push:
    paths: ['index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**', 'android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Signing key. Uses repository secrets if configured (recommended, permanent key):
      #   BP_KEYSTORE_BASE64, BP_KEYSTORE_PASSWORD, BP_KEY_ALIAS, BP_KEY_PASSWORD
      # Otherwise a key is generated once and kept in the Actions cache so updates install over each other.
      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: ~/bp-signing
          key: bp-signing-key-v1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.BP_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BP_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BP_KEY_PASSWORD }}
        run: |
          mkdir -p ~/bp-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/bp-signing/secret.jks
            echo "BP_KEYSTORE=$HOME/bp-signing/secret.jks" >> $GITHUB_ENV
            echo "BP_KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "BP_KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
            echo "BP_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            if [ ! -f ~/bp-signing/release.jks ]; then
              PASS=$(openssl rand -hex 16)
              keytool -genkeypair -v -keystore ~/bp-signing/release.jks -storepass "$PASS" -keypass "$PASS" \
                -alias breachpoint -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Breachpoint Task Force, O=Breachpoint, C=US"
              echo "$PASS" > ~/bp-signing/pass.txt
            fi
            PASS=$(cat ~/bp-signing/pass.txt)
            echo "::add-mask::$PASS"
            echo "BP_KEYSTORE=$HOME/bp-signing/release.jks" >> $GITHUB_ENV
            echo "BP_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
            echo "BP_KEY_ALIAS=breachpoint" >> $GITHUB_ENV
            echo "BP_KEY_PASSWORD=$PASS" >> $GITHUB_ENV
          fi

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Breachpoint-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Breachpoint-apk
          path: Breachpoint-*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          gh release create "$TAG" Breachpoint-*.apk \
            --target "${{ github.sha }}" \
            --title "Breachpoint for Android v1.0.${{ github.run_number }}" \
            --notes "Android build of BREACHPOINT: TASK FORCE from branch \`${{ github.ref_name }}\`. Download the .apk below on your Android device, open it, and allow installing from this source when prompted (Android 7.0+)." \
            --latest
