name: Build & Release

on:
  push:
    paths: ['src/**', 'tests/**', 'Breachpoint.sln', 'Directory.Build.props', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit tests + headless smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests
        run: dotnet test tests/Breachpoint.Core.Tests -c Release --logger "console;verbosity=normal"
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Play through every screen headless
        continue-on-error: true
        env:
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: null
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          dotnet build src/Breachpoint.Desktop -c Release
          timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" dotnet src/Breachpoint.Desktop/bin/Release/net8.0/Breachpoint.dll --autotest screenshots
          cat screenshots/result.txt
          grep -qx OK screenshots/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

  desktop:
    name: Desktop (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained build
        run: |
          dotnet publish src/Breachpoint.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -o out/Breachpoint
          cd out && zip -qr "../Breachpoint-${{ matrix.rid }}.zip" Breachpoint
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: Breachpoint-${{ matrix.rid }}.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET 8 SDK (newer preinstalled SDKs reject net8.0-android)
        run: |
          SDK=$(dotnet --list-sdks | awk '/^8\./{print $1}' | sort -V | tail -1)
          echo "Using SDK $SDK"
          dotnet new globaljson --sdk-version "$SDK" --roll-forward latestPatch --force
          dotnet --version
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Signing key. Uses repository secrets if configured (recommended, permanent key):
      #   BP_KEYSTORE_BASE64, BP_KEYSTORE_PASSWORD, BP_KEY_ALIAS, BP_KEY_PASSWORD
      # Otherwise a key is generated once and kept in the Actions cache so updates install over each other.
      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: ~/bp-signing
          key: bp-signing-key-v1
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.BP_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BP_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BP_KEY_PASSWORD }}
        run: |
          mkdir -p ~/bp-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/bp-signing/secret.jks
            echo "BP_KEYSTORE=$HOME/bp-signing/secret.jks" >> $GITHUB_ENV
            echo "BP_STORE_PASS=$KS_PASS" >> $GITHUB_ENV
            echo "BP_KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
            echo "BP_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          else
            if [ ! -f ~/bp-signing/release.jks ]; then
              PASS=$(openssl rand -hex 16)
              keytool -genkeypair -v -keystore ~/bp-signing/release.jks -storepass "$PASS" -keypass "$PASS" \
                -alias breachpoint -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Breachpoint Task Force, O=Breachpoint, C=US"
              echo "$PASS" > ~/bp-signing/pass.txt
            fi
            PASS=$(cat ~/bp-signing/pass.txt)
            echo "::add-mask::$PASS"
            echo "BP_KEYSTORE=$HOME/bp-signing/release.jks" >> $GITHUB_ENV
            echo "BP_STORE_PASS=$PASS" >> $GITHUB_ENV
            echo "BP_KEY_ALIAS=breachpoint" >> $GITHUB_ENV
            echo "BP_KEY_PASS=$PASS" >> $GITHUB_ENV
          fi
      - name: Build signed APK
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          dotnet publish src/Breachpoint.Android -c Release -f net8.0-android \
            -p:ApplicationVersion=$VERSION_CODE -p:ApplicationDisplayVersion=2.0.${{ github.run_number }} \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$BP_KEYSTORE" -p:AndroidSigningKeyAlias="$BP_KEY_ALIAS" \
            -p:AndroidSigningStorePass="$BP_STORE_PASS" -p:AndroidSigningKeyPass="$BP_KEY_PASS" -o out
          cp out/*-Signed.apk "Breachpoint-2.0.${{ github.run_number }}.apk"
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Breachpoint-*.apk

  release:
    name: Publish GitHub Release
    needs: [test, desktop, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk dist/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Breachpoint v2.0.${{ github.run_number }} (C# / MonoGame)" \
            --notes "C# / MonoGame build of BREACHPOINT: TASK FORCE from branch \`${{ github.ref_name }}\`.

          - **Android:** download the \`.apk\` on your phone (Android 6.0+), open it and allow installing from this source.
          - **Windows:** download \`Breachpoint-win-x64.zip\`, extract, run \`Breachpoint.exe\`.
          - **Linux:** download \`Breachpoint-linux-x64.zip\`, extract, run \`./Breachpoint\`." \
            --latest
